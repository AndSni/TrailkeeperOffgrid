name: release

# Builds a signed release APK and publishes it as a rolling GitHub Release
# tagged `latest`. The APK is never committed into the repo — F-Droid builds
# straight from tagged source, and a repo with binaries baked into its
# history is exactly what that process disallows. See docs/BLUEPRINT.md
# sec 2.3.
#
# Signing secrets (optional — without them the APK is debug-signed but still
# installs):
#   RELEASE_KEYSTORE_B64      base64 of the .jks
#   RELEASE_KEYSTORE_PASSWORD store password
#   RELEASE_KEY_ALIAS         key alias
#   RELEASE_KEY_PASSWORD      key password

on:
  push:
    branches: ["main"]
    paths: ["android/**", ".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        working-directory: android
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            {
              # Absolute path: app/build.gradle.kts's file(storeFile) resolves
              # a relative path against the :app module dir, not this one, so
              # a bare "release.jks" here silently looks for android/app/release.jks.
              echo "storeFile=$(pwd)/release.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASS"
            } > keystore.properties
            echo "Release signing configured."
          else
            echo "No RELEASE_KEYSTORE_B64 secret — APK will be debug-signed."
          fi

      - name: Assemble release
        working-directory: android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage APK for release
        id: stage
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          VNAME=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          VCODE=$(grep -oP 'versionCode = \K[0-9]+' android/app/build.gradle.kts)
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          mkdir -p release-artifacts
          cp "$APK" "release-artifacts/TrailkeeperOffgrid.apk"

      - name: Publish rolling 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            "release-artifacts/TrailkeeperOffgrid.apk" \
            --title "Latest (${{ steps.stage.outputs.vname }})" \
            --notes "Rolling build of \`main\`. Install: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/TrailkeeperOffgrid.apk"
