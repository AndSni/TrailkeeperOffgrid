# metadata/en-US/{short_description,full_description}.txt in this repo is
# the single source of truth; duplicating the text here would just drift.

# Each tagged release also publishes a GitHub Release at the same tag
# name (.github/workflows/release-tag.yml) carrying the identical,
# developer-signed APK, so F-Droid's reproducible-build check can diff
# its from-source build against it.
