Builds:
  - versionName: 0.3.9
    versionCode: 17
    commit: 332bd7f07b1e27bc54c19c4a1a7ce19a59f6aa51
    # android/ is the Gradle root (gradlew lives here); the app module -
    # and its build/outputs/apk/release/ - is android/app. F-Droid's
    # build tooling searches for the output APK directly under `subdir`,
    # not under a nested app/ inside it, so this must point at the
    # module itself, not the Gradle invocation root.
    subdir: android/app
    gradle:
      - yes

